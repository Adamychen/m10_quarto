<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Una secuencia, varias lecturas</title>
  <desc id="desc">La misma secuencia se representa como tokens, estados ocultos, logits, máscara de pérdida SFT, valores por estado y una recompensa por secuencia.</desc>
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #1e3a5f; }
    .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
    .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
    .small { font: 13px Arial, sans-serif; fill: #475569; }
    .cell { font: 15px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
    .cell-light { font: 15px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    .cell-dark { font: 15px Arial, sans-serif; fill: #000; text-anchor: middle; dominant-baseline: middle; }
    .line { stroke: #94a3b8; stroke-width: 1.5; }
  </style>

  <rect width="1120" height="500" rx="14" fill="#ffffff"/>
  <text x="24" y="34" class="title">Una secuencia, varias lecturas</text>
  <text x="24" y="58" class="subtitle">La arquitectura no cambia cuando pasamos de predecir tokens a estimar valores.</text>

  <line x1="190" y1="72" x2="190" y2="466" class="line"/>
  <text x="24" y="104" class="label">Tokens</text>
  <text x="24" y="166" class="label">Estados h_t</text>
  <text x="24" y="184" class="small">B x T x d</text>
  <text x="24" y="238" class="label">LM logits</text>
  <text x="24" y="256" class="small">B x T x |V|</text>
  <text x="24" y="318" class="label">Máscara SFT</text>
  <text x="24" y="336" class="small">pérdida por token</text>
  <text x="24" y="398" class="label">Value</text>
  <text x="24" y="416" class="small">B x T x 1</text>
  <text x="24" y="458" class="label">Reward</text>
  <text x="24" y="476" class="small">B x 1</text>

  <g>
    <rect x="205" y="80" width="145" height="45" rx="7" fill="#4B8BBE" stroke="#1e3a5f"/>
    <rect x="365" y="80" width="145" height="45" rx="7" fill="#4B8BBE" stroke="#1e3a5f"/>
    <rect x="525" y="80" width="145" height="45" rx="7" fill="#4B8BBE" stroke="#1e3a5f"/>
    <rect x="685" y="80" width="145" height="45" rx="7" fill="#4B8BBE" stroke="#1e3a5f"/>
    <rect x="845" y="80" width="145" height="45" rx="7" fill="#4B8BBE" stroke="#1e3a5f"/>
    <text x="277" y="103" class="cell-light">&lt;user&gt;</text>
    <text x="437" y="103" class="cell-light">explica</text>
    <text x="597" y="103" class="cell-light">&lt;assistant&gt;</text>
    <text x="757" y="103" class="cell-light">La</text>
    <text x="917" y="103" class="cell-light">atención</text>
  </g>

  <g>
    <rect x="205" y="145" width="145" height="45" rx="7" fill="#FFD43B" stroke="#b8860b"/>
    <rect x="365" y="145" width="145" height="45" rx="7" fill="#FFD43B" stroke="#b8860b"/>
    <rect x="525" y="145" width="145" height="45" rx="7" fill="#FFD43B" stroke="#b8860b"/>
    <rect x="685" y="145" width="145" height="45" rx="7" fill="#FFD43B" stroke="#b8860b"/>
    <rect x="845" y="145" width="145" height="45" rx="7" fill="#FFD43B" stroke="#b8860b"/>
    <text x="277" y="168" class="cell-dark">h_1</text>
    <text x="437" y="168" class="cell-dark">h_2</text>
    <text x="597" y="168" class="cell-dark">h_3</text>
    <text x="757" y="168" class="cell-dark">h_4</text>
    <text x="917" y="168" class="cell-dark">h_5</text>
  </g>

  <g>
    <rect x="205" y="215" width="145" height="45" rx="7" fill="#2e7d32" stroke="#0d3010"/>
    <rect x="365" y="215" width="145" height="45" rx="7" fill="#2e7d32" stroke="#0d3010"/>
    <rect x="525" y="215" width="145" height="45" rx="7" fill="#2e7d32" stroke="#0d3010"/>
    <rect x="685" y="215" width="145" height="45" rx="7" fill="#2e7d32" stroke="#0d3010"/>
    <rect x="845" y="215" width="145" height="45" rx="7" fill="#2e7d32" stroke="#0d3010"/>
    <text x="277" y="238" class="cell-light">z_1</text>
    <text x="437" y="238" class="cell-light">z_2</text>
    <text x="597" y="238" class="cell-light">z_3</text>
    <text x="757" y="238" class="cell-light">z_4</text>
    <text x="917" y="238" class="cell-light">z_5</text>
  </g>

  <g>
    <rect x="205" y="295" width="145" height="45" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="365" y="295" width="145" height="45" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="525" y="295" width="145" height="45" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="685" y="295" width="145" height="45" rx="7" fill="#2e7d32" stroke="#0d3010"/>
    <rect x="845" y="295" width="145" height="45" rx="7" fill="#2e7d32" stroke="#0d3010"/>
    <text x="277" y="318" class="cell">0</text>
    <text x="437" y="318" class="cell">0</text>
    <text x="597" y="318" class="cell">0</text>
    <text x="757" y="318" class="cell-light">1</text>
    <text x="917" y="318" class="cell-light">1</text>
    <text x="1010" y="318" class="small">0 = ignorar</text>
    <text x="1010" y="336" class="small">1 = entrenar</text>
  </g>

  <g>
    <rect x="205" y="375" width="145" height="45" rx="7" fill="#e65100" stroke="#bf360c"/>
    <rect x="365" y="375" width="145" height="45" rx="7" fill="#e65100" stroke="#bf360c"/>
    <rect x="525" y="375" width="145" height="45" rx="7" fill="#e65100" stroke="#bf360c"/>
    <rect x="685" y="375" width="145" height="45" rx="7" fill="#e65100" stroke="#bf360c"/>
    <rect x="845" y="375" width="145" height="45" rx="7" fill="#e65100" stroke="#bf360c"/>
    <text x="277" y="398" class="cell-light">V(s_1)</text>
    <text x="437" y="398" class="cell-light">V(s_2)</text>
    <text x="597" y="398" class="cell-light">V(s_3)</text>
    <text x="757" y="398" class="cell-light">V(s_4)</text>
    <text x="917" y="398" class="cell-light">V(s_5)</text>
  </g>

  <rect x="205" y="435" width="785" height="45" rx="7" fill="#e65100" stroke="#bf360c"/>
  <text x="597" y="458" class="cell-light">r(x, y): una puntuación para la secuencia completa</text>

  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="277" y1="125" x2="277" y2="145"/>
    <line x1="437" y1="125" x2="437" y2="145"/>
    <line x1="597" y1="125" x2="597" y2="145"/>
    <line x1="757" y1="125" x2="757" y2="145"/>
    <line x1="917" y1="125" x2="917" y2="145"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
