<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Bloque Transformer decoder-only moderno</title>
  <desc id="desc">Diagrama de un modelo decoder-only con embeddings, un bloque repetido de RMSNorm, atención causal, conexiones residuales, MLP y una cabeza de lenguaje.</desc>
  <style>
    .title { font: 700 25px Arial, sans-serif; fill: #1e3a5f; }
    .label { font: 700 16px Arial, sans-serif; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; }
    .section-label { font: 700 16px Arial, sans-serif; fill: #1e293b; dominant-baseline: middle; }
    .small { font: 14px Arial, sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
    .light { font: 16px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    .dimension { font: 12px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    .dark { font: 16px Arial, sans-serif; fill: #000; text-anchor: middle; dominant-baseline: middle; }
    .dimension-dark { font: 12px Arial, sans-serif; fill: #000; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <rect width="1000" height="900" rx="14" fill="#ffffff"/>
  <text x="500" y="36" class="title" text-anchor="middle">Un bloque Transformer decoder-only</text>
  <text x="500" y="61" class="small">La forma B x T x d se conserva dentro del bloque; la cabeza cambia la dimensión de salida.</text>

  <rect x="260" y="82" width="480" height="52" rx="9" fill="#4B8BBE" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="500" y="108" class="light">IDs de tokens</text>
  <text x="500" y="126" class="dimension">B x T</text>
  <line x1="500" y1="134" x2="500" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="158" width="560" height="56" rx="9" fill="#FFD43B" stroke="#b8860b" stroke-width="1.5"/>
  <text x="500" y="184" class="dark">Embedding de tokens + posición</text>
  <text x="500" y="202" class="dimension-dark">H_0: B x T x d</text>
  <line x1="500" y1="214" x2="500" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="242" width="800" height="458" rx="15" fill="#f8fafc" stroke="#306998" stroke-width="2"/>
  <text x="125" y="270" class="section-label">Bloque repetido L veces</text>

  <rect x="260" y="292" width="480" height="52" rx="8" fill="#dbeafe" stroke="#4B8BBE" stroke-width="1.5"/>
  <text x="500" y="318" class="label">RMSNorm</text>
  <line x1="500" y1="344" x2="500" y2="370" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="370" width="560" height="58" rx="8" fill="#FFD43B" stroke="#b8860b" stroke-width="1.5"/>
  <text x="500" y="396" class="label">Self-attention causal multi-cabeza</text>
  <text x="500" y="415" class="small">cada token solo consulta el pasado</text>
  <line x1="500" y1="428" x2="500" y2="454" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="500" cy="470" r="18" fill="#ffffff" stroke="#306998" stroke-width="2"/>
  <text x="500" y="470" class="label" font-size="22">+</text>
  <path d="M500 230 H80 V470 H482" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="55" y="378" class="small" transform="rotate(-90 55 378)">conexión residual</text>
  <line x1="500" y1="488" x2="500" y2="516" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="516" width="480" height="52" rx="8" fill="#dbeafe" stroke="#4B8BBE" stroke-width="1.5"/>
  <text x="500" y="542" class="label">RMSNorm</text>
  <line x1="500" y1="568" x2="500" y2="584" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="584" width="560" height="58" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="500" y="610" class="label">MLP / FFN (por posición)</text>
  <text x="500" y="629" class="small">en LLM modernos: a menudo SwiGLU</text>
  <line x1="500" y1="642" x2="500" y2="652" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="500" cy="670" r="18" fill="#ffffff" stroke="#306998" stroke-width="2"/>
  <text x="500" y="670" class="label" font-size="22">+</text>
  <path d="M500 500 H840 V670 H518" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="874" y="570" class="small" transform="rotate(90 874 570)">conexión residual</text>

  <path d="M920 242 q35 0 35 35 v386 q0 35 -35 35" fill="none" stroke="#e65100" stroke-width="2"/>
  <text x="967" y="470" class="label" transform="rotate(90 967 470)">x L</text>

  <line x1="500" y1="688" x2="500" y2="726" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="726" width="480" height="52" rx="8" fill="#dbeafe" stroke="#4B8BBE" stroke-width="1.5"/>
  <text x="500" y="752" class="label">RMSNorm final</text>
  <line x1="500" y1="778" x2="500" y2="804" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="804" width="480" height="52" rx="8" fill="#e65100" stroke="#bf360c" stroke-width="1.5"/>
  <text x="500" y="830" class="light">LM head: logits sobre el vocabulario</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
